<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirGem · flight copilot</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { color-scheme: light; --ink: #18212f; --muted: #697386; --line: #dfe4ec; --blue: #2457d6; --soft: #f6f8fb; --green: #16803c; }
    * { box-sizing: border-box; }
    body { background: var(--soft); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; margin: 0; }
    main { margin: 0 auto; max-width: 68rem; padding: 2rem 1rem 4rem; }
    header { margin-bottom: 1.5rem; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 2rem; margin-bottom: .25rem; }
    h2 { font-size: 1.35rem; margin-bottom: .3rem; }
    h3 { font-size: 1rem; margin-bottom: .6rem; }
    .muted { color: var(--muted); }
    .panel, .flight, .facts { background: white; border: 1px solid var(--line); border-radius: .8rem; }
    .panel { padding: 1rem; }
    .search-grid { display: grid; gap: .75rem; grid-template-columns: 12rem 1fr auto; align-items: end; }
    label { color: var(--muted); display: block; font-size: .85rem; margin-bottom: .25rem; }
    textarea, input, select { border: 1px solid #c8d0dc; border-radius: .45rem; font: inherit; padding: .65rem .7rem; width: 100%; }
    textarea { min-height: 4.4rem; resize: vertical; }
    input[type=file] { background: white; font-size: .9rem; }
    button { background: var(--blue); border: 0; border-radius: .45rem; color: white; cursor: pointer; font: inherit; padding: .62rem .85rem; }
    button.secondary { background: white; border: 1px solid #b9c4d5; color: var(--ink); }
    button:hover { filter: brightness(.95); }
    .calendar-row { display: grid; gap: .75rem; grid-template-columns: 1fr 9rem; margin-top: .75rem; }
    .hint { font-size: .82rem; margin: .3rem 0 0; }
    .busy { display: none; }
    .htmx-request.busy, .htmx-request .busy { display: inline; }
    .workspace { margin-top: 1.25rem; }
    .chat { display: grid; gap: .65rem; margin-bottom: 1.25rem; }
    .message { border-radius: .7rem; max-width: 85%; padding: .7rem .85rem; white-space: pre-wrap; }
    .user-message { background: #e5edff; justify-self: end; }
    .assistant-message { background: white; border: 1px solid var(--line); justify-self: start; }
    .message-label { color: var(--muted); display: block; font-size: .75rem; margin-bottom: .15rem; }
    .results-header { align-items: baseline; display: flex; justify-content: space-between; gap: 1rem; }
    .cards { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); }
    .flight { padding: 1rem; }
    .flight.selected { border: 2px solid var(--green); padding: calc(1rem - 1px); }
    .flight-title { align-items: start; display: flex; justify-content: space-between; gap: .75rem; }
    .flight-title strong { font-size: 1.05rem; }
    .badge { background: #e4f5e9; border-radius: 999px; color: var(--green); font-size: .75rem; padding: .2rem .5rem; white-space: nowrap; }
    .price { font-size: 1.25rem; font-weight: 700; margin: .65rem 0; }
    .leg { border-top: 1px solid var(--line); margin-top: .65rem; padding-top: .65rem; }
    .leg strong { display: block; }
    .flight-actions { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .8rem; }
    .flight-actions button { font-size: .9rem; }
    .facts { background: #fffdf0; border-color: #ead98b; margin-top: 1rem; padding: 1rem; }
    .facts ul { margin: 0; padding-left: 1.2rem; }
    .notes { color: var(--muted); margin-top: 1rem; }
    .error { background: #fff1f1; border: 1px solid #e0aaaa; border-radius: .6rem; color: #8a1c1c; margin-top: 1rem; padding: .8rem 1rem; }
    .follow-up { margin-top: 1.25rem; }
    .follow-up-row { display: flex; gap: .5rem; }
    .follow-up-row input { flex: 1; }
    .empty { color: var(--muted); padding: 1rem 0; }
    @media (max-width: 42rem) {
      .search-grid, .calendar-row { grid-template-columns: 1fr; }
      .message { max-width: 100%; }
      .follow-up-row { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AirGem</h1>
      <p class="muted">A local flight copilot. Ask for a search, then refine it in plain language.</p>
    </header>

    <section class="panel">
      <form hx-post="/ui/search" hx-target="#workspace" hx-swap="innerHTML" hx-encoding="multipart/form-data" hx-indicator="#searching">
        <div class="search-grid">
          <div>
            <label for="provider">LLM provider</label>
            <select id="provider" name="provider">
              <option value="ollama">Ollama</option>
              <option value="openrouter">OpenRouter</option>
            </select>
          </div>
          <div>
            <label for="prompt">What are you looking for?</label>
            <textarea id="prompt" name="prompt" required placeholder="Find cheap flights from GRU to POA on 2027-01-01, returning 2027-01-08"></textarea>
          </div>
          <button type="submit">Search flights</button>
        </div>
        <div class="calendar-row">
          <div>
            <label for="calendar">Optional local calendar (.ics)</label>
            <input id="calendar" name="calendar" type="file" accept=".ics,text/calendar">
            <p class="hint muted">Calendar data is used in memory and discarded after the search starts.</p>
          </div>
          <div>
            <label for="buffer_minutes">Travel buffer</label>
            <input id="buffer_minutes" name="buffer_minutes" type="number" min="0" value="60">
          </div>
        </div>
        <span id="searching" class="busy muted">AirGem is checking flights…</span>
      </form>
    </section>

    <section id="workspace" aria-live="polite"></section>
  </main>
</body>
</html>
