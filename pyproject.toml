[project]
name = "airgem"
version = "0.1.0"
description = "Privacy-first flight search copilot"
readme = "PROJECT.md"
authors = [
    { name = "wate", email = "ryan.o2712@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "icalendar>=7.3.0",
    "python-dotenv>=1.0.0",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
airgem = "airgem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airgem"]

[tool.pytest.ini_options]
pythonpath = ["src"]
